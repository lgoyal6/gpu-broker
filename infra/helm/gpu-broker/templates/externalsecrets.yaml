{{- /* External Secrets Operator interface: the secret material lives in the
operator's store; the chart only declares where to read it from. */ -}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "gb.secretName" . }}
  labels: {{- include "gb.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target: { name: {{ include "gb.secretName" . }}, creationPolicy: Owner }
  data:
    - secretKey: dispatch-key
      remoteRef: { key: {{ required "externalSecrets.dispatchKey is required" .Values.externalSecrets.dispatchKey | quote }} }
    {{- range $pool, $key := .Values.externalSecrets.bootstrapTokens }}
    - secretKey: bootstrap-{{ $pool }}
      remoteRef: { key: {{ $key | quote }} }
    {{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "gb.dbSecretName" . }}
  labels: {{- include "gb.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target: { name: {{ include "gb.dbSecretName" . }}, creationPolicy: Owner }
  dataFrom:
    - extract: { key: {{ required "externalSecrets.database is required" .Values.externalSecrets.database | quote }} }
{{- end }}
