{{- /*
Generated once and then reused: `lookup` returns the live Secret on upgrade,
so a `helm upgrade` never rotates the dispatch key or a bootstrap token out
from under running agents. Rotation is a deliberate runbook step.
*/ -}}
{{- if and (not .Values.secrets.existingSecret) (not .Values.externalSecrets.enabled) }}
{{- $name := include "gb.secretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "gb.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  dispatch-key: {{ if $old }}{{ index $old.data "dispatch-key" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  {{- range .Values.pools }}
  {{- $k := printf "bootstrap-%s" .id }}
  {{ $k }}: {{ if and $old (hasKey $old.data $k) }}{{ index $old.data $k }}{{ else }}{{ printf "gpub_bootstrap_%s_%s" (randAlphaNum 12 | lower) (randAlphaNum 40) | b64enc }}{{ end }}
  {{- end }}
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.database.existingSecret) }}
---
{{- $db := include "gb.dbSecretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $db }}
{{- $pw := .Values.postgresql.password | default (randAlphaNum 32) }}
{{- $spw := randAlphaNum 32 }}
{{- if $old }}{{ $pw = index $old.data "postgres-password" | b64dec }}{{ $spw = index $old.data "status-password" | b64dec }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $db }}
  labels: {{- include "gb.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  postgres-password: {{ $pw | quote }}
  status-password: {{ $spw | quote }}
  url: {{ printf "postgres://gpub:%s@%s-postgres:5432/gpub?sslmode=disable" $pw .Release.Name | quote }}
  status-url: {{ printf "postgres://gpub_status_login:%s@%s-postgres:5432/gpub?sslmode=disable" $spw .Release.Name | quote }}
{{- end }}
