name: analytics

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hadoop-hyper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Xmx768m
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: "9.8.1"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Aggregation, Parquet and DataNode failure readback
        run: gradle test --no-daemon --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx768m -XX:ActiveProcessorCount=2'
      - name: Export fixture through the Java CLI
        run: gradle run --no-daemon --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx768m -XX:ActiveProcessorCount=2' --args="fixtures/events.jsonl $RUNNER_TEMP/gpu-broker-analytics"
      - name: Install pinned Hyper API
        run: python -m pip install -r requirements-hyper.txt
      - name: Export and compare every Hyper cell
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/analytics/scripts/build_tableau_hyper.py" "$RUNNER_TEMP/gpu-broker-analytics/tableau/gpu_broker_metrics.csv" "$RUNNER_TEMP/gpu-broker-analytics/tableau/gpu_broker_metrics.hyper"
