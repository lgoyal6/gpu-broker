name: attest

# Build provenance and SBOM attestation for the distributions this package ships.
#
# Push-triggered on purpose: the attestation is a statement about a build that
# actually happened, signed with an identity only GitHub's OIDC issuer can mint
# for this repository. There is no way to produce one out of band, which is what
# makes `gh attestation verify` mean anything.
#
# The subjects are the sdist and the wheel, which are the bytes an installer
# fetches. Attesting the source tree instead would attest something nobody
# installs.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # mint the OIDC token Sigstore binds the signature to
      attestations: write # write the signed bundle to this repository's attestation store
    steps:
      # Every action is pinned to a commit SHA rather than a tag: a tag is a
      # mutable pointer its owner can move to different code at any time, so a
      # tag pin does not fix what actually runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Scans the source tree rather than the wheel: the wheel's metadata is generated from pyproject.toml, so the tree carries the same declared dependency set plus the dev and web extras a wheel scan would miss.
      - name: sbom
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: gpu-broker.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # The digests the attestation will carry. Printed so the value a verifier
      # computes locally can be compared against the run that produced it.
      - name: artifact digests
        run: sha256sum dist/* | tee artifact-digests.txt

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: attest sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*
          sbom-path: gpu-broker.spdx.json

      # The attested bytes themselves, so verification can be run against the
      # exact artifact the attestation names rather than a local rebuild.
      - name: upload attested artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpu-broker-attested
          path: |
            dist/*
            gpu-broker.spdx.json
            artifact-digests.txt
          if-no-files-found: error
